<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comet Studio</title>
<style>
  :root {
    --bg: #15171c;
    --panel: #1d2027;
    --line: #2c3039;
    --text: #c9ced8;
    --muted: #7d8494;
    --accent: #ffa300;
    --error: #ff5c6c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
    font-size: 13px;
  }

  /* ---- 上方工具列 ---- */
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; color: #fff; font-weight: 600; }
  header .spacer { flex: 1; }
  .speed { display: inline-flex; }
  .speed button { border-radius: 0; padding-left: 8px; padding-right: 8px; }
  .speed button:first-child { border-radius: 6px 0 0 6px; }
  .speed button:last-child { border-radius: 0 6px 6px 0; }
  .speed button + button { margin-left: -1px; }
  .speed button.on { background: var(--accent); border-color: var(--accent); color: #111; }
  #frame-count.fast { font-weight: 600; }   /* 加速中：粗體，提醒自己開著加速 */
  button, select {
    font: inherit;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #444a56; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  label.toggle { display: flex; align-items: center; gap: 4px; color: var(--muted); }

  /* ---- 主區：左邊程式碼、右邊遊戲 ---- */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(340px, 660px);
    min-height: 0;
  }
  .code { display: flex; flex-direction: row; min-height: 0; border-right: 1px solid var(--line); }
  #editor { flex: 1; min-height: 0; overflow: hidden; }
  #project-name { color: var(--accent); font-weight: 600; }

  /* ---- 地圖編輯器（mapedit.js）---- */
  #mapedit { flex: 1; min-height: 0; display: flex; flex-direction: column; outline: none; }
  #mapedit[hidden] { display: none; }
  /* 工具列永遠只有一行（放不下就左右捲動）：換行的話，按鈕文字一變，下面的地圖就會上下跳 */
  .me-bar { display: flex; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; align-items: center; gap: 4px 8px;
            padding: 6px 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; flex-shrink: 0; }
  .me-bar > * { flex-shrink: 0; }
  .me-bar button { padding: 3px 8px; }
  .me-bar button.on { background: var(--accent); border-color: var(--accent); color: #111; }
  .me-bar input[type=number] { width: 52px; }
  .me-group { display: inline-flex; align-items: center; gap: 4px; }
  .me-sep { width: 1px; height: 18px; background: var(--line); }
  .me-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px; }
  .me-map-wrap { overflow: auto; padding: 8px; }
  .me-map, .me-pal { display: block; image-rendering: pixelated; cursor: crosshair; }
  .me-side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
  .me-side-bar { display: flex; gap: 6px; padding: 6px; }
  .me-side-bar select { flex: 1; min-width: 0; }
  .me-pal-wrap { flex: 1; min-height: 0; overflow: auto; padding: 0 6px; }
  .me-obj { padding: 8px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .me-obj[hidden] { display: none; }
  .me-obj-hint { color: var(--muted); }
  .me-obj-title { display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: 600; }
  .me-obj-row { display: grid; grid-template-columns: 9em minmax(0, 1fr) auto; gap: 6px; align-items: center; color: var(--muted); }
  .me-obj-row textarea, .me-obj-row input, .me-obj-row select { width: 100%; box-sizing: border-box; }
  .me-status { padding: 6px 8px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  /* ---- 音效編輯器（sfxedit.js）---- */
  #sfxedit { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
  #sfxedit[hidden] { display: none; }
  .se-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .se-bar input[type=number] { width: 52px; background: #1b1d22; color: var(--fg); border: 1px solid #30343c; border-radius: 4px; }
  .se-bar select { background: #1b1d22; color: var(--fg); border: 1px solid #30343c; border-radius: 4px; }
  .se-title { color: #fff; font-weight: 600; }
  .se-grid { display: block; margin: 8px 10px; max-width: calc(100% - 20px); touch-action: none; cursor: crosshair; image-rendering: pixelated; }
  .se-status { padding: 0 10px 6px; font-size: 12px; color: var(--muted); }
  .se-status.bad { color: #ff5c6c; }
  .se-pats { margin: 6px 10px 12px; border-collapse: collapse; font-size: 12px; }
  .se-pats th { color: var(--muted); font-weight: 500; text-align: left; padding: 2px 6px; }
  .se-pats td { padding: 2px 6px; border-bottom: 1px solid #262a31; }
  .se-pats select { background: #1b1d22; color: var(--fg); border: 1px solid #30343c; border-radius: 4px; }

  /* ---- 資料表編輯器（dataedit.js）---- */
  #dataedit { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #dataedit[hidden] { display: none; }
  .de-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .de-title { color: #fff; font-weight: 600; }
  .de-spacer { flex: 1; }
  .de-main { flex: 1; min-height: 0; overflow: auto; padding: 8px; }
  .de-table { border-collapse: collapse; font-size: 12px; }
  .de-table th { position: sticky; top: 0; background: #23262d; color: var(--muted); font-weight: 500; text-align: left;
                 padding: 4px 6px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
  .de-table td { padding: 2px 3px; border-bottom: 1px solid #262a31; vertical-align: middle; }
  .de-table input, .de-table select { background: #1b1d22; color: var(--fg); border: 1px solid #30343c; border-radius: 4px;
                                      padding: 3px 5px; font: inherit; box-sizing: border-box; }
  .de-table input.de-num { width: 56px; text-align: right; }
  .de-table input.de-text { width: 110px; }
  .de-table input.de-long { width: 260px; }
  .de-table input.de-json { width: 220px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  .de-table input.bad, .de-textarea.bad { border-color: #ff5c6c; background: #3a1d22; }
  .de-id { color: var(--accent); font-weight: 600; padding-right: 8px !important; white-space: nowrap; }
  .de-row-tools { white-space: nowrap; }
  .de-row-tools button { padding: 2px 6px; font-size: 11px; }
  .de-area { margin-bottom: 16px; }
  .de-area-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
  .de-area-head b { color: #fff; }
  .de-area-head input { width: 56px; text-align: right; }
  .de-muted { color: var(--muted); }
  .de-textarea { width: 100%; height: 100%; box-sizing: border-box; background: #1b1d22; color: var(--fg); border: 1px solid #30343c;
                 font-family: ui-monospace, Menlo, monospace; font-size: 13px; padding: 8px; resize: none; }
  .de-status { padding: 6px 8px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  .de-status.bad { color: #ff5c6c; }
  .single-only { display: contents; }
  body.folder-mode .single-only { display: none; }

  /* 資料夾模式：左邊檔案總管＋上面「開著的檔案」分頁（2026-10-22：檔案一多，原本全部攤成分頁會擠掉編輯區） */
  .code-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #explorer {
    width: 190px; flex: none; display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--line); background: #1b1d22; font-size: 12px;
  }
  #explorer[hidden] { display: none; }
  .ex-head { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); }
  .ex-head input { flex: 1; min-width: 0; background: #23262d; color: var(--fg); border: 1px solid #30343c;
                   border-radius: 4px; padding: 3px 6px; font-size: 12px; }
  .ex-head button { padding: 2px 6px; }
  #ex-list { flex: 1; overflow: auto; padding: 4px 0 12px; }
  .ex-group { display: flex; align-items: center; gap: 4px; padding: 6px 8px 3px; color: var(--muted);
              cursor: pointer; user-select: none; font-weight: 600; }
  .ex-group .ex-count { font-weight: 400; opacity: 0.7; }
  .ex-group .ex-add { margin-left: auto; border: none; background: none; color: var(--accent); padding: 0 4px; font-size: 14px; }
  .ex-item { display: block; width: 100%; text-align: left; border: none; border-radius: 0; background: none;
             color: var(--fg); padding: 3px 8px 3px 22px; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex-item:hover { background: #262a31; }
  .ex-item.on { background: #2f3542; color: #fff; }
  .ex-item.open:not(.on) { color: #cfd6e4; }
  .ex-item.dirty::after { content: " ●"; color: var(--accent); }
  .ex-empty { padding: 6px 12px; color: var(--muted); }

  /* 開著的檔案：一行，放不下就左右捲 */
  #files {
    display: flex; flex-wrap: nowrap; align-items: flex-end; gap: 2px;
    padding: 6px 8px 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  #files[hidden] { display: none; }
  #files .ftab {
    flex: none; display: inline-flex; align-items: center; gap: 2px;
    border-radius: 6px 6px 0 0; color: var(--muted); padding: 0 2px 0 0;
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: nowrap;
  }
  #files .ftab.on { background: #282c34; color: #fff; }
  #files .ftab button { border: none; background: none; color: inherit; font: inherit; padding: 6px 4px 6px 10px; }
  #files .ftab .x { padding: 2px 5px; border-radius: 4px; opacity: 0.5; }
  #files .ftab .x:hover { opacity: 1; background: #3a3f4b; }
  #files .ftab.dirty .name::after { content: " ●"; color: var(--accent); }
  #files .ex-toggle { flex: none; border: none; background: none; color: var(--muted); padding: 6px 8px; }
  #editor .cm-editor { height: 100%; }
  #editor .cm-scroller { font-size: 14px; }
  .cm-error-line { background: rgba(255, 92, 108, 0.18) !important; }
  .cm-syntax-line { text-decoration: underline wavy var(--accent); text-underline-offset: 3px; }
  #syntax-msg {
    padding: 6px 12px;
    color: var(--accent);
    background: rgba(255, 163, 0, 0.1);
    border-top: 1px solid var(--line);
    cursor: pointer;
    font-size: 13px;
  }
  #syntax-msg[hidden] { display: none; }

  .side {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .screen-wrap { padding: 12px; }
  /* 遊戲畫面（只套用到 #screen；圖片檢視器的畫布用自己的尺寸） */
  #screen {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    image-rendering: pixelated;
    background: #000;
    outline: 2px solid transparent;
    cursor: pointer;
  }
  #screen:focus { outline-color: var(--accent); }
  .status {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    margin-top: 6px;
  }
  .status .playing { color: var(--accent); }
  #budget { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; cursor: help; margin: 0 8px; }
  .budget-bar { width: 48px; height: 6px; background: #2a2e37; border-radius: 3px; overflow: hidden; }
  .budget-fill { display: block; height: 100%; width: 0; background: var(--accent); }
  #budget.warn .budget-fill { background: #ffa300; }
  #budget.warn .budget-text { color: #ffa300; }
  #budget.over .budget-fill { background: var(--error); }
  #budget.over .budget-text { color: var(--error); }

  /* ---- 下方分頁：主控台／API ---- */
  .tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); }
  .tabs button { border: none; border-radius: 0; background: none; color: var(--muted); padding: 8px 10px; }
  .tabs button.on { color: #fff; box-shadow: inset 0 -2px 0 var(--accent); }
  .tab-body { flex: 1; min-height: 0; overflow: auto; padding: 8px 12px; }
  .tab-body[hidden] { display: none; }
  .img-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--muted); }
  #img-canvas { display: block; image-rendering: pixelated; cursor: pointer; }

  #console { font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; }
  #console .line { padding: 2px 0; border-bottom: 1px solid #22252c; }
  #console .err { color: var(--error); cursor: pointer; }
  #console .err:hover { text-decoration: underline; }
  #console .info { color: var(--muted); }

  /* ---- 狀態分頁（debugpanel.js）---- */
  #state { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .dbg-cmd { display: flex; gap: 6px; margin-bottom: 6px; }
  .dbg-input { flex: 1; min-width: 0; font: inherit; padding: 5px 8px; background: #111317; color: #fff; border: 1px solid var(--line); border-radius: 6px; }
  .dbg-input:focus { outline: 1px solid var(--accent); }
  .dbg-buttons { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .dbg-buttons button { font-size: 12px; padding: 3px 8px; }
  .dbg-buttons .dbg-danger { margin-left: auto; color: var(--error); }
  .dbg-out { max-height: 90px; overflow: auto; margin-bottom: 6px; white-space: pre-wrap; }
  .dbg-out:empty { display: none; }
  .dbg-line { padding: 1px 0; }
  .dbg-line.cmd { color: var(--muted); }
  .dbg-line.err { color: var(--error); }
  .dbg-tree { border-top: 1px solid var(--line); padding-top: 4px; }
  .dbg-row { padding: 1px 0; cursor: pointer; white-space: nowrap; }
  .dbg-row:hover { background: #22252c; }
  .dbg-arrow { display: inline-block; width: 12px; color: var(--muted); }
  .dbg-key { color: #9cdcfe; }
  .dbg-count { color: var(--muted); }
  .dbg-val { color: #ce9178; }
  .dbg-hint { color: var(--muted); line-height: 1.6; }
  .dbg-tools:empty { display: none; }
  .dbg-tool { margin-bottom: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .dbg-tool summary { cursor: pointer; }
  .dbg-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  .dbg-form select, .dbg-form input { font: inherit; background: #111317; color: #fff; border: 1px solid var(--line); border-radius: 4px; }
  .dbg-tool-out { margin: 0; max-height: 260px; overflow: auto; white-space: pre-wrap; }
  .dbg-tool-out:empty { display: none; }

  #api h2 { font-size: 14px; margin: 14px 0 6px; color: #fff; }
  #api h3 { font-size: 13px; margin: 12px 0 4px; color: #fff; }
  #api table { border-collapse: collapse; margin: 4px 0; }
  #api td, #api th { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
  #api code, #api pre { font-family: ui-monospace, Menlo, monospace; background: #111317; border-radius: 4px; }
  #api code { padding: 1px 4px; }
  #api pre { padding: 8px; overflow: auto; }
  #api p, #api li { line-height: 1.6; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    padding: 10px 16px;
    border-radius: 8px;
    background: #2a2e37;
    color: #fff;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* 窄螢幕：上下排 */
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 50vh auto; }
    .side { order: -1; }
    .code { border-right: none; border-top: 1px solid var(--line); }
    .tab-body { max-height: 30vh; }
    #explorer { width: 150px; }
  }
</style>
</head>
<body>
<header>
  <h1>Comet Studio</h1>
  <button id="btn-folder" title="直接編輯電腦上的專案資料夾（需要 Chrome 或 Edge）">📁 開啟資料夾</button>
  <button id="btn-reopen" hidden></button>
  <span id="project-name"></span>
  <span class="single-only">
  <select id="template" title="從範例開始">
    <option value="">新遊戲／範例…</option>
    <option value="games/blank.lua">空白遊戲</option>
    <option value="games/move_box.lua">移動方塊</option>
    <option value="games/catch.lua">接住掉落的方塊</option>
  </select>
  <button id="btn-open">開啟 .lua</button>
  </span>
  <button id="btn-download">下載 .lua</button>
  <button id="btn-ai" title="把說明文件和目前的程式碼一起複製，貼給 ChatGPT、Claude 等 AI">複製給 AI</button>
  <span class="spacer"></span>
  <label class="toggle"><input type="checkbox" id="auto-run" checked> 修改後自動重新執行</label>
  <span class="speed" id="speed" title="加速遊戲（開發用）：每 1/60 秒跑 2 或 4 幀。在遊戲畫面上按住 ` 鍵暫時 ×4">
    <button data-speed="1" class="on">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button>
  </span>
  <button id="btn-sound" title="聲音開關">🔊</button>
  <button id="btn-pause">暫停</button>
  <button id="btn-step" disabled>下一幀</button>
  <button id="btn-run" class="primary" title="Ctrl + Enter（Mac：⌘ + Enter）">▶ 重新執行</button>
  <a href="index.html" target="_blank"><button>遊玩頁 ↗</button></a>
</header>
<input type="file" id="file-picker" accept=".lua,text/plain" hidden>

<main>
  <div class="code">
    <nav id="explorer" hidden>
      <div class="ex-head">
        <input id="ex-filter" placeholder="找檔案（⌘P）" spellcheck="false">
        <button id="ex-hide" title="收起檔案總管（⌘B）">«</button>
      </div>
      <div id="ex-list"></div>
    </nav>
    <div class="code-main">
    <div id="files" hidden></div>
    <div id="editor"></div>
    <div id="mapedit" hidden></div>
    <div id="dataedit" hidden></div>
    <div id="sfxedit" hidden></div>
    <div id="syntax-msg" hidden title="點一下跳到那一行"></div>
    </div>
  </div>
  <div class="side">
    <div class="screen-wrap">
      <canvas id="screen" width="320" height="240" tabindex="0"></canvas>
      <div class="status">
        <span id="focus-hint">點一下畫面就能用鍵盤玩：WASD 移動、K = A、L = B、J = X、I = Y、Q／E = L／R、方向鍵 = 右搖桿、Enter = Start、Tab = Select、按住 ` 加速</span>
        <span id="budget" title="運算預算"><span class="budget-bar"><span class="budget-fill"></span></span><span class="budget-text">Pico —</span></span>
        <span id="frame-count"></span>
      </div>
    </div>
    <div class="tabs">
      <button data-tab="console" class="on">主控台</button>
      <button data-tab="state" title="看遊戲現在的狀態、執行除錯指令（DEBUG_VIEW、DEBUG_COMMANDS）">狀態</button>
      <button data-tab="images">圖片</button>
      <button data-tab="api">API 說明</button>
    </div>
    <div class="tab-body" id="console"></div>
    <div class="tab-body" id="state" hidden></div>
    <div class="tab-body" id="images" hidden>
      <div class="img-bar">
        <select id="img-select"></select>
        <span id="img-info"></span>
      </div>
      <canvas id="img-canvas" width="0" height="0"></canvas>
    </div>
    <div class="tab-body" id="api" hidden></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module" src="studio.js"></script>
</body>
</html>
