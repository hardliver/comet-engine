<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- user-scalable=no：手機連點時不要放大網頁
     viewport-fit=cover：全螢幕時延伸到瀏海、圓角區域，再用 safe-area 留邊 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- iPhone：從主畫面開啟時，不顯示 Safari 的網址列 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<title>Comet</title>
<style>
  :root {
    --side-min: 200px;   /* 橫拿時兩側按鈕區至少多寬：寧可畫面小一點，按鈕也要夠大 */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    color: #aaa;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    /* 手機上：不要捲動、不要選取文字、不要長按跳出選單 */
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }

  /* ---- 電腦：畫面置中，下面是說明 ---- */
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  /* canvas 本身是 320×240，用 CSS 放大。
     pixelated：放大時不要模糊，保持一格一格的像素 */
  canvas {
    width: min(640px, 100vw);
    aspect-ratio: 4 / 3;
    image-rendering: pixelated;
    display: block;
  }

  .help { text-align: center; line-height: 1.7; margin: 0; }
  .help a { color: #ffa300; }
  kbd {
    display: inline-block;
    min-width: 1.6em;
    padding: 0 4px;
    border: 1px solid #444;
    border-radius: 4px;
    background: #1a1a1a;
    color: #ddd;
    font: 12px ui-monospace, monospace;
    text-align: center;
  }

  button.tool {
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border: 1px solid #333;
    border-radius: 14px;
    background: #1a1a1a;
    color: #aaa;
    white-space: nowrap;
  }
  .desktop-bar { display: flex; gap: 8px; }

  .hint {
    display: none;
    position: fixed;
    left: 50%;
    top: 30%;
    transform: translateX(-50%);
    max-width: 80vw;
    padding: 14px 18px;
    border-radius: 10px;
    background: #222;
    color: #ddd;
    line-height: 1.6;
    text-align: center;
    z-index: 20;
  }
  .hint.show { display: block; }

  /* ============================================================
     觸控按鈕
     ============================================================
     設計原則（以拇指操作為主）：
     1. 最常用的放在拇指自然停放的地方：左邊的移動、右邊的 A
        都在下半部、靠外側；比較少用的（十字鍵、右搖桿）放上面、靠畫面那一側
     2. 按鈕夠大：A B X Y 直徑約 60px 以上（手指按下的寬度約 45px）
     3. 左搖桿是「浮動式」：在左區下半部任何空白處按下，搖桿中心就在那裡，
        不用看、也不會按偏
     4. A B X Y 用「離手指最近的鍵」判斷：按在兩顆中間也算數，按著可以滑到隔壁那顆
     5. 不常用的功能（載入、全螢幕、換配置）收進「☰」選單

     大小用 --u 表示：整組按鈕照 200 × 300 個單位設計，
     --u 依按鈕區的寬、高自動縮放（100cqw、100cqh 是按鈕區的寬、高） */
  .zone {
    display: none;
    position: relative;
    align-self: stretch;     /* 撐滿整格：按鈕區沒有撐開的話高度是 0，按鈕全部消失 */
    justify-self: stretch;
    container-type: size;
    --reserve: 96px;    /* 上方 L/R、下方 Select/Start 要用的高度 */
  }
  .zone > * {
    --u: min(calc(100cqw / 200), calc((100cqh - var(--reserve)) / 300));
  }

  /* 中間放大按鈕的區域：上方留 48px 給 L/R，下方留 48px 給 Select/Start */
  .cluster {
    position: absolute;
    left: 50%;
    top: calc(48px + (100cqh - var(--reserve) - var(--u) * 300) / 2);
    width: calc(var(--u) * 200);
    height: calc(var(--u) * 300);
    transform: translateX(-50%);
  }

  /* ---- 十字鍵 ---- */
  .pad {
    position: absolute;
    border-radius: 50%;
    background: #222;
  }
  .pad .cross { position: absolute; inset: 0; }
  .pad .cross::before, .pad .cross::after {
    content: "";
    position: absolute;
    background: #454545;
    border-radius: 7px;
  }
  .pad .cross::before { left: 33%; top: 8%; width: 34%; height: 84%; }
  .pad .cross::after  { left: 8%; top: 33%; width: 84%; height: 34%; }
  .pad.active .cross::before, .pad.active .cross::after { background: #5a5a5a; }

  /* ---- 搖桿 ---- */
  .stick {
    position: absolute;
    border-radius: 50%;
    background: #222;
    border: 2px solid #2c2c2c;
  }
  .stick .knob {
    position: absolute;
    left: 25%;
    top: 25%;
    width: 50%;
    height: 50%;
    border-radius: 50%;
    background: #555;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }
  .stick.active .knob { background: #ffa300; }

  /* ---- A B X Y ---- */
  .face { position: absolute; }
  .round {
    position: absolute;
    border-radius: 50%;
    background: #444;
    color: #ddd;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;   /* 由 .face 統一判斷按到哪一顆 */
  }

  .pill {
    position: absolute;
    min-width: 72px;
    padding: 9px 14px;
    border-radius: 16px;
    background: #2e2e2e;
    color: #bbb;
    font-size: 13px;
    text-align: center;
  }
  .pressed { background: #ffa300 !important; color: #111 !important; }

  /* ---- 現代配置 ----
     左區：上方（靠畫面）十字鍵，下方（靠外側）左搖桿
     右區：上方（靠畫面）右搖桿，下方（靠外側）A B X Y 菱形，A 在最下面 */
  #dpad    { width: calc(var(--u) * 100); height: calc(var(--u) * 100); top: 0; right: 0; }
  #lstick  { width: calc(var(--u) * 132); height: calc(var(--u) * 132); bottom: calc(var(--u) * 8); left: 0; }
  #rstick  { width: calc(var(--u) * 96);  height: calc(var(--u) * 96);  top: 0; left: 0; }
  .face    { width: calc(var(--u) * 186); height: calc(var(--u) * 186); bottom: 0; right: 0; }
  .round   { width: calc(var(--u) * 62);  height: calc(var(--u) * 62); font-size: calc(var(--u) * 22); }
  .round.y { left: calc(var(--u) * 62);  top: 0; }
  .round.x { left: 0;                    top: calc(var(--u) * 62); }
  .round.b { left: calc(var(--u) * 124); top: calc(var(--u) * 62); }
  .round.a { left: calc(var(--u) * 62);  top: calc(var(--u) * 124); }

  /* 角落的小按鈕 */
  .left-zone  .shoulder  { top: 6px; left: 8px; }
  .right-zone .shoulder  { top: 6px; right: 8px; }
  .left-zone  .menu-btn  { bottom: 6px; left: 8px; }
  .right-zone .menu-btn  { bottom: 6px; right: 8px; }
  .left-zone  .open-menu { top: 6px; right: 8px; min-width: 44px; }

  /* ---- 紅白機配置：只有十字鍵、B、A，放大放在拇指停放處 ---- */
  body.layout-nes .shoulder,
  body.layout-nes .stick,
  body.layout-nes .round.x,
  body.layout-nes .round.y { display: none; }
  body.layout-nes #dpad {
    width: calc(var(--u) * 170); height: calc(var(--u) * 170);
    top: auto; right: auto; bottom: calc(var(--u) * 30); left: calc(var(--u) * 10);
  }
  body.layout-nes .face { width: calc(var(--u) * 190); height: calc(var(--u) * 110); bottom: calc(var(--u) * 50); }
  body.layout-nes .round { width: calc(var(--u) * 80); height: calc(var(--u) * 80); background: #8a1c1c; color: #eee; font-size: calc(var(--u) * 26); }
  body.layout-nes .round.b { left: 0;                    top: calc(var(--u) * 26); }
  body.layout-nes .round.a { left: calc(var(--u) * 104); top: 0; }

  /* ---- ☰ 選單 ---- */
  .menu-pop {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    border-radius: 14px;
    background: #1d1d1d;
    border: 1px solid #333;
    z-index: 15;
  }
  .menu-pop.show { display: flex; }
  .menu-pop button { font-size: 16px; padding: 12px 24px; }

  /* ============================================================
     觸控裝置（手指這種「粗」的指標）
     ============================================================ */
  @media (pointer: coarse) {
    .help, .desktop-bar { display: none; }
    .zone { display: block; }

    /* 直拿：畫面在上，下面左右兩區按鈕 */
    body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 0;
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    canvas { grid-column: 1 / -1; width: 100vw; }
    .left-zone  { grid-column: 1; grid-row: 2; }
    .right-zone { grid-column: 2; grid-row: 2; }
  }

  /* 橫拿：畫面用滿高度，兩側放按鈕（至少 --side-min 寬） */
  @media (pointer: coarse) and (orientation: landscape) {
    body {
      grid-template-columns: minmax(var(--side-min), 1fr) auto minmax(var(--side-min), 1fr);
      grid-template-rows: 100%;
      padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
    }
    canvas {
      grid-column: 2;
      grid-row: 1;
      align-self: center;
      width: min(calc(100dvh * 4 / 3),
                 calc(100vw - 2 * var(--side-min) - env(safe-area-inset-left) - env(safe-area-inset-right)));
    }
    .left-zone  { grid-column: 1; grid-row: 1; }
    .right-zone { grid-column: 3; grid-row: 1; }
  }
</style>
</head>
<body class="layout-modern">

<canvas id="screen" width="320" height="240"></canvas>

<div class="desktop-bar">
  <button class="tool" id="btn-load">載入遊戲</button>
</div>
<p class="help">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動
  <kbd>K</kbd> A　<kbd>L</kbd> B　<kbd>J</kbd> X　<kbd>I</kbd> Y
  <kbd>Q</kbd> L　<kbd>E</kbd> R
  <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 右搖桿
  <kbd>Enter</kbd> Start　<kbd>Tab</kbd> Select<br>
  可以把 .lua 遊戲檔拖進這個網頁　·　<a href="studio.html">打開編輯器</a><br>
  <span id="pad-info">沒有偵測到手把（接上後要先按一個鍵，瀏覽器才會看到）</span>
</p>
<input type="file" id="file-picker" accept=".lua,text/plain" hidden>

<div class="zone left-zone" id="left-zone">
  <div class="pill shoulder" data-btn="10">L</div>
  <div class="pill open-menu" id="btn-menu">☰</div>
  <div class="cluster">
    <div class="pad" id="dpad"><div class="cross"></div></div>
    <div class="stick" id="lstick"><div class="knob"></div></div>
  </div>
  <div class="pill menu-btn" data-btn="7">SELECT</div>
</div>

<div class="zone right-zone">
  <div class="pill shoulder" data-btn="11">R</div>
  <div class="cluster">
    <div class="stick" id="rstick"><div class="knob"></div></div>
    <div class="face" id="face">
      <div class="round y" data-face="9">Y</div>
      <div class="round x" data-face="8">X</div>
      <div class="round b" data-face="5">B</div>
      <div class="round a" data-face="4">A</div>
    </div>
  </div>
  <div class="pill menu-btn" data-btn="6">START</div>
</div>

<div class="menu-pop" id="menu">
  <button class="tool" id="btn-fullscreen">全螢幕</button>
  <button class="tool" id="btn-load-touch">載入遊戲</button>
  <button class="tool" id="btn-layout">配置：現代</button>
  <button class="tool" id="btn-close-menu">關閉</button>
</div>

<div class="hint" id="hint"></div>

<script type="module" src="play.js"></script>
</body>
</html>
