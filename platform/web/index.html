<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- user-scalable=no：手機連點時不要放大網頁
     viewport-fit=cover：全螢幕時延伸到瀏海、圓角區域，再用 safe-area 留邊 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- iPhone：從主畫面開啟時，不顯示 Safari 的網址列 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<title>Comet</title>
<style>
  /* 觸控按鈕的大小都用 --u（一個「單位」）表示，--u 會依按鈕區的大小自動縮放，
     所以畫面最大化之後，兩側剩多少空間，按鈕就縮放到剛好放得下 */
  :root {
    --side-min: 130px;   /* 橫拿時兩側按鈕區至少多寬 */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    color: #aaa;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    /* 手機上：不要捲動、不要選取文字、不要長按跳出選單 */
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }

  /* ---- 電腦：畫面置中，下面是說明 ---- */
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  /* canvas 本身是 320×240，用 CSS 放大。
     pixelated：放大時不要模糊，保持一格一格的像素 */
  canvas {
    width: min(640px, 100vw);
    aspect-ratio: 4 / 3;
    image-rendering: pixelated;
    display: block;
  }

  .help { text-align: center; line-height: 1.7; margin: 0; }
  .help a { color: #ffa300; }
  kbd {
    display: inline-block;
    min-width: 1.6em;
    padding: 0 4px;
    border: 1px solid #444;
    border-radius: 4px;
    background: #1a1a1a;
    color: #ddd;
    font: 12px ui-monospace, monospace;
    text-align: center;
  }

  /* ---- 工具列 ---- */
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: center; }
  .topbar button {
    font: inherit;
    font-size: 12px;
    padding: 5px 10px;
    border: 1px solid #333;
    border-radius: 12px;
    background: #1a1a1a;
    color: #999;
    white-space: nowrap;
  }
  .touch-only { display: none !important; }

  .hint {
    display: none;
    position: fixed;
    left: 50%;
    top: 30%;
    transform: translateX(-50%);
    max-width: 80vw;
    padding: 14px 18px;
    border-radius: 10px;
    background: #222;
    color: #ddd;
    line-height: 1.6;
    text-align: center;
    z-index: 10;
  }
  .hint.show { display: block; }

  /* ============================================================
     觸控按鈕
     ============================================================
     按鈕區（.zone）是「容器」：裡面的 100cqw、100cqh 指的是按鈕區的寬、高。
     整組按鈕照 200 × 240 個單位設計，--u 取「寬度放得下」和「高度放得下」中較小的。
     --reserve 是上下要留給 L/R、Select/Start 的空間 */
  .zone {
    display: none;
    position: relative;
    align-self: stretch;
    justify-self: stretch;
    container-type: size;
    --reserve: 44px;
  }
  .zone > * {
    --u: min(calc(100cqw / 200), calc((100cqh - var(--reserve)) / 240));
  }

  /* 十字鍵：用百分比畫，底座多大十字就多大 */
  .pad {
    position: absolute;
    border-radius: 50%;
    background: #222;
  }
  .pad .cross { position: absolute; inset: 0; }
  .pad .cross::before, .pad .cross::after {
    content: "";
    position: absolute;
    background: #444;
    border-radius: 6px;
  }
  .pad .cross::before { left: 33%; top: 10%; width: 34%; height: 80%; }
  .pad .cross::after  { left: 10%; top: 33%; width: 80%; height: 34%; }
  .pad.active .cross::before, .pad.active .cross::after { background: #555; }

  /* 搖桿：底座 + 跟著手指移動的圓頭 */
  .stick {
    position: absolute;
    width: calc(var(--u) * 100);
    height: calc(var(--u) * 100);
    border-radius: 50%;
    background: #222;
  }
  .stick .knob {
    position: absolute;
    left: 25%;
    top: 25%;
    width: 50%;
    height: 50%;
    border-radius: 50%;
    background: #555;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }
  .stick.active .knob { background: #ffa300; }

  /* A B X Y：用 grid 排成菱形
         Y
       X   B      （和 Xbox 手把的右手區相同）
         A        */
  .face {
    position: absolute;
    display: grid;
    grid-template-columns: repeat(3, calc(var(--u) * 44));
    grid-template-rows: repeat(3, calc(var(--u) * 44));
    grid-template-areas:
      ".  y  ."
      "x  .  b"
      ".  a  .";
  }
  .round {
    border-radius: 50%;
    background: #444;
    color: #ddd;
    font-weight: bold;
    font-size: calc(var(--u) * 17);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .round.a { grid-area: a; }
  .round.b { grid-area: b; }
  .round.x { grid-area: x; }
  .round.y { grid-area: y; }

  .pill {
    padding: 5px 12px;
    border-radius: 12px;
    background: #333;
    color: #bbb;
    font-size: 12px;
    text-align: center;
  }
  .shoulder { position: absolute; top: 6px; width: 64px; }

  .pressed { background: #ffa300 !important; color: #111 !important; }

  /* ---- 現代配置：照 Xbox 手把的比例 ----
     左手：左搖桿在左上，十字鍵在它的右下方，兩個靠在一起
     右手：ABXY 在右上，右搖桿在它的左下方
     兩組各自包成一個 .cluster（200 × 240 單位），放在按鈕區中間 */
  .left-zone  .shoulder { left: 10px; }
  .right-zone .shoulder { right: 10px; }
  .cluster {
    position: absolute;
    left: 50%;
    width: calc(var(--u) * 200);
    height: calc(var(--u) * 240);
    top: calc(40px + (100cqh - var(--reserve) - var(--u) * 240) / 2);
    transform: translateX(-50%);
  }
  #lstick { top: 0; left: calc(var(--u) * 6); }
  .left-zone .pad {
    width: calc(var(--u) * 92);
    height: calc(var(--u) * 92);
    top: calc(var(--u) * 128);
    left: calc(var(--u) * 96);
  }
  .face { top: 0; right: 0; }
  #rstick { top: calc(var(--u) * 132); left: calc(var(--u) * 10); }

  /* ---- 紅白機配置：只有十字鍵、B、A，放大置中 ---- */
  body.layout-nes .shoulder,
  body.layout-nes .stick,
  body.layout-nes .round.x,
  body.layout-nes .round.y { display: none; }
  body.layout-nes .left-zone .pad {
    width: calc(var(--u) * 160);
    height: calc(var(--u) * 160);
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
  body.layout-nes .face {
    grid-template-columns: repeat(2, calc(var(--u) * 64));
    grid-template-rows: calc(var(--u) * 64);
    grid-template-areas: "b a";
    gap: calc(var(--u) * 12);
    left: 50%;
    top: 50%;
    right: auto;
    transform: translate(-50%, -50%) rotate(-15deg);
  }
  body.layout-nes .round { background: #8a1c1c; color: #eee; font-size: calc(var(--u) * 22); }

  /* ============================================================
     觸控裝置（手指這種「粗」的指標）
     ============================================================ */
  @media (pointer: coarse) {
    .help { display: none; }
    .touch-only { display: inline-block !important; }
    .zone { display: block; }

    /* 直拿：畫面在最上面，接著工具列，下面左右兩區按鈕 */
    body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto 1fr;
      gap: 8px 0;
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    canvas { grid-column: 1 / -1; width: 100vw; }
    .topbar { grid-column: 1 / -1; flex-wrap: wrap; padding: 0 8px; }
    .left-zone  { grid-column: 1; grid-row: 3; }
    .right-zone { grid-column: 2; grid-row: 3; }
    /* 直拿時下面空間很高，按鈕區固定高度、放在中間，手指才搆得到 */
    .zone { height: 340px; align-self: center; }
  }

  /* 橫拿：畫面用滿整個高度（最大化），兩側用剩下的寬度放按鈕，按鈕跟著縮放。
     工具列拆開放到四個角落 */
  @media (pointer: coarse) and (orientation: landscape) {
    body {
      grid-template-columns: minmax(var(--side-min), 1fr) auto minmax(var(--side-min), 1fr);
      grid-template-rows: 100%;
      gap: 0;
      padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
    }
    canvas {
      grid-column: 2;
      grid-row: 1;
      align-self: center;
      /* 寬度：高度 × 4/3，但要留兩側最小寬度給按鈕 */
      width: min(calc(100dvh * 4 / 3),
                 calc(100vw - 2 * var(--side-min) - env(safe-area-inset-left) - env(safe-area-inset-right)));
    }
    .left-zone  { grid-column: 1; grid-row: 1; }
    .right-zone { grid-column: 3; grid-row: 1; }
    .zone { height: auto; align-self: stretch; --reserve: 150px; }   /* 下方要留給角落的按鈕 */

    /* 工具列的每個按鈕各自固定在角落：左下是 Select 和工具，右下是 Start 和配置 */
    .topbar { display: contents; }
    .topbar > * { position: fixed; z-index: 5; font-size: 11px; }
    .topbar [data-btn="7"]  { left:  calc(10px + env(safe-area-inset-left));  bottom: 10px; }
    #btn-load               { left:  calc(10px + env(safe-area-inset-left));  bottom: 44px; }
    #btn-fullscreen         { left:  calc(10px + env(safe-area-inset-left));  bottom: 78px; }
    .topbar [data-btn="6"]  { right: calc(10px + env(safe-area-inset-right)); bottom: 10px; }
    #btn-layout             { right: calc(10px + env(safe-area-inset-right)); bottom: 44px; }
  }
</style>
</head>
<body class="layout-modern">

<div class="topbar">
  <button id="btn-fullscreen" class="touch-only">全螢幕</button>
  <button id="btn-load">載入遊戲</button>
  <div class="pill touch-only" data-btn="7">SELECT</div>
  <div class="pill touch-only" data-btn="6">START</div>
  <button id="btn-layout" class="touch-only">配置：現代</button>
</div>

<canvas id="screen" width="320" height="240"></canvas>

<p class="help">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動
  <kbd>K</kbd> A　<kbd>L</kbd> B　<kbd>J</kbd> X　<kbd>I</kbd> Y
  <kbd>Q</kbd> L　<kbd>E</kbd> R
  <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 右搖桿
  <kbd>Enter</kbd> Start　<kbd>Tab</kbd> Select<br>
  可以把 .lua 遊戲檔拖進這個網頁　·　<a href="studio.html">打開編輯器</a><br>
  <span id="pad-info">沒有偵測到手把（接上後要先按一個鍵，瀏覽器才會看到）</span>
</p>
<input type="file" id="file-picker" accept=".lua,text/plain" hidden>

<div class="zone left-zone">
  <div class="pill shoulder" data-btn="10">L</div>
  <div class="cluster">
    <div class="stick" id="lstick"><div class="knob"></div></div>
    <div class="pad" id="dpad"><div class="cross"></div></div>
  </div>
</div>

<div class="zone right-zone">
  <div class="pill shoulder" data-btn="11">R</div>
  <div class="cluster">
    <div class="face">
      <div class="round y" data-btn="9">Y</div>
      <div class="round x" data-btn="8">X</div>
      <div class="round b" data-btn="5">B</div>
      <div class="round a" data-btn="4">A</div>
    </div>
    <div class="stick" id="rstick"><div class="knob"></div></div>
  </div>
</div>

<div class="hint" id="hint"></div>

<script type="module" src="play.js"></script>
</body>
</html>
