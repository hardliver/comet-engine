<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- user-scalable=no：手機連點時不要放大網頁
     viewport-fit=cover：全螢幕時延伸到瀏海、圓角區域，再用 safe-area 留邊 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- iPhone：從主畫面開啟時，不顯示 Safari 的網址列 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<title>Comet</title>
<style>
  /* 按鈕尺寸集中在這裡，改這幾個數字就能調整大小 */
  :root {
    --pad: 150px;    /* 十字鍵／搖桿底座的直徑 */
    --btn: 56px;     /* A B X Y 圓鈕的直徑 */
    --side: 190px;   /* 橫拿時左右兩側按鈕區的寬度 */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    color: #aaa;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    /* 手機上：不要捲動、不要選取文字、不要長按跳出選單 */
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  /* canvas 本身是 320×240，用 CSS 放大。
     pixelated：放大時不要模糊，保持一格一格的像素 */
  canvas {
    width: min(640px, 100vw);
    aspect-ratio: 4 / 3;
    image-rendering: pixelated;
    display: block;
  }

  .help { text-align: center; line-height: 1.6; margin: 0; }
  .help a { color: #ffa300; }

  /* ---- 工具列 ---- */
  .toolbar { display: flex; gap: 8px; }
  .toolbar button {
    font: inherit;
    font-size: 12px;
    padding: 5px 10px;
    border: 1px solid #333;
    border-radius: 12px;
    background: #1a1a1a;
    color: #999;
    white-space: nowrap;
  }
  #btn-layout { display: none; }   /* 觸控配置只有手機需要 */

  .hint {
    display: none;
    position: fixed;
    left: 50%;
    top: 30%;
    transform: translateX(-50%);
    max-width: 80vw;
    padding: 14px 18px;
    border-radius: 10px;
    background: #222;
    color: #ddd;
    line-height: 1.6;
    text-align: center;
    z-index: 10;
  }
  .hint.show { display: block; }

  /* ---- 觸控按鈕：預設隱藏，只有觸控裝置才顯示 ---- */
  .controls { display: none; }

  /* 左手區：固定大小，不會被擠扁（flex-shrink: 0） */
  .pad {
    position: relative;
    flex-shrink: 0;
    width: var(--pad);
    height: var(--pad);
    border-radius: 50%;
    background: #222;
  }
  /* 紅白機配置：十字鍵。用百分比畫，底座多大十字就多大 */
  .pad .cross { position: absolute; inset: 0; }
  .pad .cross::before, .pad .cross::after {
    content: "";
    position: absolute;
    background: #444;
    border-radius: 6px;
  }
  .pad .cross::before { left: 33%; top: 10%; width: 34%; height: 80%; }
  .pad .cross::after  { left: 10%; top: 33%; width: 80%; height: 34%; }
  .pad.active .cross::before, .pad.active .cross::after { background: #555; }

  /* 現代配置：類比搖桿的圓頭，位置由 JavaScript 跟著手指移動 */
  .pad .knob {
    display: none;
    position: absolute;
    left: 30%;
    top: 30%;
    width: 40%;
    height: 40%;
    border-radius: 50%;
    background: #555;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
  }
  body.layout-modern .pad .cross { display: none; }
  body.layout-modern .pad .knob  { display: block; }

  /* 右手區：用 grid 排位置
     紅白機：B A 一排
     現代：  Y
           X   B      （Xbox 手把的右手區）
             A        */
  .face {
    display: grid;
    flex-shrink: 0;
    gap: 6px;
    grid-template-columns: repeat(2, var(--btn));
    grid-template-areas: "b a";
  }
  body.layout-modern .face {
    grid-template-columns: repeat(3, var(--btn));
    grid-template-rows: repeat(3, var(--btn));
    grid-template-areas:
      ".  y  ."
      "x  .  b"
      ".  a  .";
    gap: 0;
  }
  .round {
    width: var(--btn);
    height: var(--btn);
    border-radius: 50%;
    background: #444;
    color: #ddd;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .round.a { grid-area: a; }
  .round.b { grid-area: b; }
  .round.x { grid-area: x; }
  .round.y { grid-area: y; }
  /* 紅白機沒有 X、Y；按鈕是紅色的 */
  body.layout-nes .round.x, body.layout-nes .round.y { display: none; }
  body.layout-nes .round { background: #8a1c1c; color: #eee; }

  .menu { display: flex; gap: 12px; }
  .pill {
    padding: 6px 14px;
    border-radius: 14px;
    background: #333;
    color: #bbb;
    font-size: 12px;
  }

  .pressed { background: #ffa300 !important; color: #111 !important; }

  /* ============================================================
     觸控裝置（手指這種「粗」的指標）
     ============================================================ */
  @media (pointer: coarse) {
    .help { display: none; }
    #btn-layout { display: inline-block; }

    /* 直拿：畫面在上，按鈕在下 */
    body {
      justify-content: flex-start;
      gap: 10px;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    canvas { width: 100vw; }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "pad  face"
        "menu menu";
      align-items: center;
      row-gap: 24px;
      width: 100%;
      padding: 16px 16px 0;
    }
    .pad  { grid-area: pad;  justify-self: start; }
    .face { grid-area: face; justify-self: end; }
    .menu { grid-area: menu; justify-self: center; }
  }

  /* 橫拿：三欄，左邊按鈕區、中間畫面、右邊按鈕區。
     兩側固定寬度，畫面用剩下的空間，按鈕不會被擠扁 */
  @media (pointer: coarse) and (orientation: landscape) {
    body {
      display: grid;
      grid-template-columns: var(--side) minmax(0, 1fr) var(--side);
      grid-template-rows: 100%;
      height: 100dvh;
      gap: 0;
      padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
    }
    canvas {
      grid-column: 2;
      grid-row: 1;
      place-self: center;
      /* 寬度：不超過中間欄，也不超過「高度 × 4/3」 */
      width: min(100%, calc(100dvh * 4 / 3));
      height: auto;
    }
    .controls { display: contents; }
    .pad  { grid-column: 1; grid-row: 1; place-self: center; }
    .face { grid-column: 3; grid-row: 1; place-self: center; }

    /* SELECT 左下角、START 右下角 */
    .menu {
      position: fixed;
      left: calc(12px + env(safe-area-inset-left));
      right: calc(12px + env(safe-area-inset-right));
      bottom: 10px;
      justify-self: stretch;  /* 蓋掉直拿時的置中，左右撐開 */
      justify-content: space-between;
      pointer-events: none;   /* 中間空白處不要擋到畫面 */
    }
    .menu .pill { pointer-events: auto; }

    /* 工具列：左上角直排；配置切換放右上角 */
    .toolbar {
      position: fixed;
      left: calc(12px + env(safe-area-inset-left));
      top: 8px;
      flex-direction: column;
      align-items: flex-start;
    }
    #btn-layout {
      position: fixed;
      right: calc(12px + env(safe-area-inset-right));
      top: 8px;
    }
  }
</style>
</head>
<body class="layout-nes">
<canvas id="screen" width="320" height="240"></canvas>

<p class="help">
  方向鍵移動　Z = A　X = B　A = X　S = Y　Enter = Start　右 Shift = Select<br>
  可以把 .lua 遊戲檔拖進這個網頁　·　<a href="studio.html">打開編輯器</a><br>
  <span id="pad-info">沒有偵測到手把（接上後要先按一個鍵，瀏覽器才會看到）</span>
</p>

<div class="toolbar">
  <button id="btn-fullscreen">全螢幕</button>
  <button id="btn-load">載入遊戲</button>
  <button id="btn-layout">配置：紅白機</button>
</div>
<input type="file" id="file-picker" accept=".lua,text/plain" hidden>

<div class="controls">
  <div class="pad" id="dpad">
    <div class="cross"></div>
    <div class="knob" id="knob"></div>
  </div>
  <div class="menu">
    <div class="pill" data-btn="7">SELECT</div>
    <div class="pill" data-btn="6">START</div>
  </div>
  <div class="face">
    <div class="round y" data-btn="9">Y</div>
    <div class="round x" data-btn="8">X</div>
    <div class="round b" data-btn="5">B</div>
    <div class="round a" data-btn="4">A</div>
  </div>
</div>

<div class="hint" id="hint"></div>

<script type="module" src="play.js"></script>
</body>
</html>
